<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri Real Madrid</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f5f5f5;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
color:#1e3a8a;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
text-align:center;
padding:15px;
}

</style>
</head>

<body>

<h1>🏆 Galeri Real Madrid 🏆</h1>

<div class="gallery">

<div class="card">
<img src="madird1.webp">
<h3>Logo Real Madrid</h3>
</div>

<div class="card">
<img src="madrid2.webp">
<h3>Santiago Bernabéu</h3>
</div>

<div class="card">
<img src="madrid3.webp">
<h3>Kylian Mbappé</h3>
</div>

<div class="card">
<img src="madrid4.webp">
<h3>Vinícius Jr</h3>
</div>

<div class="card">
<img src="madrid5.webp">
<h3>Jude Bellingham</h3>
</div>

<div class="card">
<img src="madrid6.webp">
<h3>Thibaut Courtois</h3>
</div>

</div>

</body>
</html>
